[project]
name = "mcp-explorer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ABeltramo", email = "1122217+ABeltramo@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "mcp>=2.0.0",
    "pydantic>=2",
    "sse-starlette>=3.4.8",
    "uvicorn[standard]>=0.52.3",
]

[project.scripts]
mcp-explorer = "mcp_explorer.__main__:main"

[build-system]
requires = ["uv_build>=0.11.31,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-ra"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
